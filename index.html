<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenSpeaks Reimbursement Form</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    :root {
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #222;
      --muted: #666;
      --line: #d9d9d9;
      --accent: #458500;
      --accent-dark: #2f5f00;
      --accent-light: #eaf4d8;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, sans-serif, Arial;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── You're welcome! ── */
    .hp-field {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
      pointer-events: none;
      tabindex: -1;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      border-top: 6px solid var(--accent);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header img {
      width: 76px;
      height: 24px;
      object-fit: contain;
    }

    .header-title {
      font-size: 18px;
      border-left: 1px solid #333;
      padding-left: 12px;
      font-weight: 700;
    }

    /* ── Content ── */
    .content {
      padding: 20px;
    }

    h1 {
      margin: 0 0 16px 0;
      font-size: 24px;
    }

    h2 {
      margin: 0 0 14px 0;
      font-size: 18px;
    }

    p.note {
      margin-top: 0;
      color: var(--muted);
    }

    /* ── Form layout ── */
    form {
      display: grid;
      gap: 16px;
    }

    /* 2-column grid (date + seq, name spans full) */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* 2-column grid for phone + email */
    .double-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    /* 3-column grid for amount + allowance + total */
    .amount-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    /* Make labels same height so inputs line up on desktop */
    .amount-grid label {
      display: flex;
      flex-direction: column;
    }

    .amount-grid label span {
      flex: 1;
      font-weight: 600;
      margin-bottom: 6px;
    }

    @media (max-width: 800px) {
      .double-grid,
      .amount-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    /* ── Inputs ── */
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      background: #fff;
      color: var(--text);
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: 2px solid #b7d58f;
      border-color: var(--accent);
    }

    input[readonly] {
      background: #f9f9f9;
      color: var(--muted);
      cursor: not-allowed;
    }

    /* ── Buttons ── */
    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button.secondary {
      background: #e8e8e8;
      color: var(--text);
      font-weight: 600;
      font-size: 13px;
      padding: 8px 12px;
    }

    button.secondary:hover {
      background: #d5d5d5;
    }

    /* ── Status ── */
    .status {
      color: var(--muted);
      min-height: 1.5em;
    }

    .small {
      color: var(--muted);
      font-size: 14px;
    }

    /* ── Admin section ── */
    .admin-toggle {
      text-align: right;
    }

    .admin-toggle button {
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .admin-toggle button:hover {
      background: #eee;
    }

    #admin-section {
      display: none;
    }

    #admin-section.visible {
      display: block;
    }

    .admin-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      overflow: hidden;
      border-top: 6px solid #888;
    }

    .admin-card .content {
      padding: 20px;
    }

    .link-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: var(--accent-light);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .link-row .link-name {
      font-weight: 700;
      min-width: 120px;
    }

    .link-row .link-url {
      flex: 1;
      font-size: 13px;
      color: var(--muted);
      word-break: break-all;
    }

    .copied-msg {
      font-size: 12px;
      color: var(--accent-dark);
      font-weight: 700;
      min-width: 50px;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- ── Reimbursement Form Card ── -->
    <div class="card">
      <div class="header">
        <a href="https://theofdn.org/openspeaks/" target="_blank" rel="noopener noreferrer">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/OpenSpeaks_logo.svg/1280px-OpenSpeaks_logo.svg.png"
            alt="OpenSpeaks logo"
          />
        </a>

      <div class="content">
        <h1>Reimbursement Form</h1>
        <p class="note">Fill the form, download the PDF copy, and forward.</p>

        <form id="reimbursement-form" novalidate>

          <!-- Honeypot (hidden from real users, traps bots) -->
          <div class="hp-field" aria-hidden="true">
            <label for="website">Leave this field empty</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" />
          </div>

          <!-- Row 1: Date + Sequence number -->
          <div class="grid">
            <div>
              <label for="date">Date</label>
              <input type="date" id="date" name="date" required />
            </div>
            <div>
              <label for="sequence_no">Reimbursement number</label>
              <input
                type="number"
                id="sequence_no"
                name="sequence_no"
                min="1"
                max="999"
                step="1"
                required
                placeholder="Enter 1 to 999"
              />
            </div>
          </div>

          <!-- Row 2: Name (full width) -->
          <div>
            <label for="name">Your name</label>
            <input type="text" id="name" name="name" required placeholder="First Last" />
          </div>

          <!-- Row 3: Phone + Email -->
          <div class="double-grid">
            <div>
              <label for="phone">Phone Number</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                inputmode="numeric"
                pattern="[0-9]{10}"
                maxlength="10"
                placeholder="10-digit phone number"
              />
            </div>
            <div>
              <label for="email">Email (optional)</label>
              <input type="email" id="email" name="email" placeholder="name@domain.org" />
            </div>
          </div>

          <!-- Row 4: Amount + Allowance + Total -->
          <div class="amount-grid">
            <label for="amount">
              <span>OpenSpeaks language documentation (INR)</span>
              <input type="number" id="amount" name="amount" min="0" step="0.01" required placeholder="0.00" />
            </label>
            <label for="allowance">
              <span>Travel/accommodation allowance (INR)</span>
              <input type="number" id="allowance" name="allowance" min="0" step="0.01" required placeholder="0.00" />
            </label>
            <label for="total">
              <span>Total (INR)</span>
              <input type="number" id="total" name="total" min="0" step="0.01" readonly placeholder="Auto-calculated" />
            </label>
          </div>

          <!-- Submit -->
          <div class="actions">
            <button type="submit">Make PDF &amp; Send</button>
            <span id="status" class="status"></span>
          </div>

          <p class="small">
            Share a phone number or an email address. If an email is entered, a copy can also be sent there.
          </p>
        </form>
      </div>
    </div>

    <!-- ── Admin toggle ── -->
    <div class="admin-toggle">
      <button type="button" id="toggle-admin">⚙ Admin: Generate Links</button>
    </div>

    <!-- ── Admin Section ── -->
    <div id="admin-section">
      <div class="admin-card">
        <div class="content">
          <h2>Admin — Generate Unique Links</h2>
          <p class="note">
            Paste one name per line. Each person gets a unique pre-filled link with a one-time token.
          </p>

          <div>
            <label for="admin-names">Names (one per line)</label>
            <textarea id="admin-names" rows="6" placeholder="Zahra M.&#10;Francis Puneeth&#10;Vibha Gautam"></textarea>
          </div>

          <div class="actions" style="margin-top:12px;">
            <button type="button" id="generate-links-btn">Generate unique links</button>
          </div>

          <div id="link-output" class="link-list"></div>
        </div>
      </div>
    </div>

  </div><!-- /.wrap -->

  <script src="main.js"></script>
</body>
</html>
